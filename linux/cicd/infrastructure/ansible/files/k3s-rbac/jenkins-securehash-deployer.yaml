apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: securehash
  labels:
    app.kubernetes.io/name: jenkins-deployer
    app.kubernetes.io/part-of: securehash
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer
  namespace: securehash
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - backend
      - frontend
    verbs:
      - patch

  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: securehash
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: securehash
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-deployer
