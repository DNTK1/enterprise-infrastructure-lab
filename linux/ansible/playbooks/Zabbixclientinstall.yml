- name: Install and configure Zabbix Agent 2 client
  hosts: zabbix_clients
  become: true
  gather_facts: true

  vars:
    zabbix_server: "10.10.0.123"
    zabbix_server_active: "10.10.0.123"
    zabbix_agent_hostname: "{{ ansible_facts['hostname'] }}"
    zabbix_repo_url: "https://repo.zabbix.com/zabbix/7.0/rhel/10/x86_64/"
    zabbix_gpg_key: "https://repo.zabbix.com/RPM-GPG-KEY-ZABBIX-B5333005"


  tasks:

    - name: Install firewalld
      ansible.builtin.dnf:
        name:
          - firewalld
        state: present

    - name: Import Zabbix GPG key
      ansible.builtin.rpm_key:
        key: "{{ zabbix_gpg_key }}"
        state: present

    - name: Add Zabbix repository
      ansible.builtin.yum_repository:
        name: zabbix
        description: Zabbix Official Repository
        baseurl: "{{ zabbix_repo_url }}"
        enabled: yes
        gpgcheck: yes
        gpgkey: "{{ zabbix_gpg_key }}"
        state: present

    - name: Refresh DNF cache
      ansible.builtin.dnf:
        update_cache: yes

    - name: Install Zabbix Agent 2
      ansible.builtin.dnf:
        name:
          - zabbix-agent2
          - zabbix-sender
        state: present

    - name: Configure Zabbix Server
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^Server='
        line: "Server={{ zabbix_server }}"
        backup: yes

    - name: Configure Zabbix Active Server
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^ServerActive='
        line: "ServerActive={{ zabbix_server_active }}"

    - name: Configure Zabbix Hostname
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^Hostname='
        line: "Hostname={{ zabbix_agent_hostname }}"
        backup: yes

    - name: Validate Zabbix Agent config
      ansible.builtin.command:
        cmd: zabbix_agent2 -T
      register: agent_config_test
      changed_when: false

    - name: Show configuration test
      ansible.builtin.debug:
        var: agent_config_test.stdout_lines

    - name: Enable firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: yes
        state: started

    - name: Open Zabbix Agent port
      ansible.posix.firewalld:
        port: 10050/tcp
        permanent: yes
        state: enabled

    - name: Reload firewalld
      ansible.builtin.systemd_service:
        name: firewalld
        state: reloaded

    - name: Enable Zabbix Agent 2
      ansible.builtin.systemd_service:
        name: zabbix-agent2
        enabled: yes
        state: restarted
      register: zabbix_service

    - name: Show service state
      ansible.builtin.debug:
        msg:
          - "Zabbix Agent status: {{ zabbix_service.status.ActiveState }}"
          - "Enabled: {{ zabbix_service.status.UnitFileState }}"

    - name: Check listening port 10050
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 10050
        timeout: 5

    - name: Test connection to Zabbix Server
      ansible.builtin.wait_for:
        host: "{{ zabbix_server_active }}"
        port: 10051
        connect_timeout: 3
        timeout: 5

    - name: Show final information
      ansible.builtin.debug:
        msg:
          - "===================================="
          - "Zabbix Agent 2 installation finished"
          - "Hostname: {{ zabbix_agent_hostname }}"
          - "Server: {{ zabbix_server }}"
          - "Agent port: 10050"
          - "===================================="
