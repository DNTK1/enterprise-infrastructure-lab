- name: Zamykanie portow na firewallu
  hosts: all
  become: true

  tasks:
    - name: Close portow na firewallu (service)
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        state: disabled
        immediate: true
      loop:
        - http
        - https

    - name: Close portow na firewallu (port)
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        state: disabled
        immediate: true
      loop:
        - 8080/tcp
        - 445/tcp
