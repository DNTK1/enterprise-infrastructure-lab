crds:
  enabled: true

defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

kubeApiServer:
  enabled: true

kubelet:
  enabled: true

coreDns:
  enabled: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  enabled: true

  prometheusSpec:
    replicas: 1

    retention: 15d
    retentionSize: 15GB

    walCompression: true
    enableAdminAPI: false

    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

    serviceMonitorSelectorNilUsesHelmValues: true
    serviceMonitorNamespaceSelector: {}

    podMonitorSelectorNilUsesHelmValues: true
    podMonitorNamespaceSelector: {}

alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1
    retention: 120h

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

grafana:
  enabled: true

  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: browser
  defaultDashboardsEditable: false

  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  testFramework:
    enabled: false

  ingress:
    enabled: true
    ingressClassName: nginx

    annotations:
      nginx.org/ssl-redirect: "true"
      nginx.org/http-redirect-code: "308"

    hosts:
      - grafana.domena.lab

    path: /
    pathType: Prefix

    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.domena.lab

  persistence:
    enabled: true
    type: sts
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    finalizers:
      - kubernetes.io/pvc-protection

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

  grafana.ini:
    server:
      domain: grafana.domena.lab
      root_url: https://grafana.domena.lab/

    users:
      allow_sign_up: false

    analytics:
      reporting_enabled: false
      check_for_updates: false

    news:
      news_feed_enabled: false

  serviceMonitor:
    enabled: true

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      provider:
        allowUiUpdates: false

    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true
